name: Fix Missing Press Summaries

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-fix-${{ hashFiles('packages/scraper/requirements.txt', 'packages/analyzer/requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r packages/scraper/requirements.txt
          pip install --no-cache-dir -r packages/analyzer/requirements.txt

      - name: Recover bodyless pending articles and generate summaries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python packages/scraper/src/fix_missing_summary.py
