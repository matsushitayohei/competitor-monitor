name: Cleanup Vercel Blob Storage

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (list only, no deletion)'
        type: boolean
        default: true

# Prevent duplicate manual runs
concurrency:
  group: cleanup-blob
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run cleanup
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python packages/scraper/src/cleanup_blob.py --dry-run
          else
            python packages/scraper/src/cleanup_blob.py
          fi
